<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get started</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    :root { --primary: #1677ff; --text: #1f1f1f; --muted: #8c8c8c; --border: #d9d9d9; --bg: #f0f2f5; --danger: #ff4d4f; --ok: #52c41a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .card { background: #fff; width: 100%; max-width: 460px; border-radius: 8px; padding: 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,.09); }
    h1 { font-size: 22px; margin: 0 0 4px; text-align: center; }
    .sub { color: var(--muted); text-align: center; margin: 0 0 24px; font-size: 14px; }
    label { display: block; font-size: 14px; margin: 14px 0 6px; }
    input { width: 100%; padding: 9px 11px; font-size: 15px; border: 1px solid var(--border); border-radius: 6px; }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,.15); }
    .plans { display: grid; gap: 10px; }
    .plan { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border); border-radius: 6px;
            padding: 12px; cursor: pointer; }
    .plan:has(input:checked) { border-color: var(--primary); background: #f0f7ff; }
    .plan input { width: auto; margin-top: 3px; }
    .plan .name { font-weight: 600; }
    .plan .price { float: right; font-weight: 600; }
    .plan .desc { color: var(--muted); font-size: 13px; margin-top: 2px; }
    button { width: 100%; margin-top: 24px; padding: 11px; font-size: 16px; border: 0; border-radius: 6px;
             background: var(--primary); color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .error { color: var(--danger); font-size: 14px; margin-top: 12px; min-height: 1em; }
    .status { text-align: center; }
    .status .icon { font-size: 40px; margin-bottom: 8px; }
    .status p { color: #595959; line-height: 1.5; }
    .spinner { width: 36px; height: 36px; margin: 0 auto 12px; border: 3px solid #e6f0ff;
               border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: var(--primary); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="product">QuadStack</h1>
    <p class="sub">Create your workspace</p>

    <form id="signup-form" novalidate>
      <div class="plans" id="plans"></div>
      <label for="company_name">Company name</label>
      <input id="company_name" name="company_name" required maxlength="100" autocomplete="organization" />
      <label for="contact_name">Your name</label>
      <input id="contact_name" name="contact_name" required maxlength="100" autocomplete="name" />
      <label for="email">Work email (your login is sent here)</label>
      <input id="email" name="email" type="email" required maxlength="255" autocomplete="email" />
      <label for="email_confirm">Confirm email</label>
      <input id="email_confirm" name="email_confirm" type="email" required maxlength="255" autocomplete="off" onpaste="return false" />
      <label for="phone">Phone (optional)</label>
      <input id="phone" name="phone" type="tel" maxlength="20" autocomplete="tel" />
      <button type="submit" id="pay-btn">Continue to payment</button>
      <div class="error" id="error" role="alert"></div>
    </form>

    <div class="status" id="status" hidden>
      <div id="status-icon"></div>
      <h2 id="status-title"></h2>
      <p id="status-text"></p>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let config = null;

    function money(amount, currency) {
      return new Intl.NumberFormat(undefined, { style: "currency", currency }).format(amount / 100);
    }

    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function showError(msg) { $("error").textContent = msg || ""; }

    async function api(path, options = {}) {
      const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const d = data.detail;
        throw new Error(Array.isArray(d) ? "Please check the highlighted details: " + d.map(e => e.loc.at(-1)).join(", ")
                                         : d || "Something went wrong, please retry");
      }
      return data;
    }

    function showStatus(state, rawEmail, rawUrl) {
      const email = esc(rawEmail), appUrl = esc(rawUrl);
      $("signup-form").hidden = true;
      $("status").hidden = false;
      const views = {
        pending:      ["spinner", "Confirming payment…", "Please keep this page open."],
        paid:         ["spinner", "Payment received", "We're setting up your workspace. This usually takes a minute or two."],
        provisioning: ["spinner", "Setting up your workspace", "This usually takes a minute or two. You can close this page; we'll email you when it's ready."],
        active:       ["ok", "Your workspace is ready", `Your login details were sent to <b>${email}</b>.` + (appUrl ? `<br><a href="${appUrl}">Open ${appUrl}</a>` : "")],
        failed:       ["err", "Payment received, setup delayed", `Your payment is safe. We hit a problem setting up the workspace and our team has been notified. We'll email <b>${email}</b> as soon as it's ready.`],
      };
      const [icon, title, text] = views[state] || views.pending;
      $("status-icon").className = icon === "spinner" ? "spinner" : "icon";
      $("status-icon").textContent = icon === "ok" ? "✅" : icon === "err" ? "⚠️" : "";
      $("status-title").textContent = title;
      $("status-text").innerHTML = text;
    }

    async function pollStatus(signupId) {
      try {
        const s = await api(`/api/signups/${signupId}`);
        showStatus(s.status, s.email, s.app_url);
        if (s.status === "active" || s.status === "failed") {
          localStorage.removeItem("signup_id");
          return;
        }
      } catch (_) { /* transient; keep polling */ }
      setTimeout(() => pollStatus(signupId), 4000);
    }

    async function init() {
      // Resume a signup in progress (e.g. page reloaded after payment)
      let saved = null;
      try { saved = localStorage.getItem("signup_id"); } catch (_) {}

      config = await api("/api/config");
      document.title = `${config.product_name} — Get started`;
      $("product").textContent = config.product_name;
      $("plans").innerHTML = config.plans.map((p, i) => `
        <label class="plan">
          <input type="radio" name="plan_id" value="${esc(p.id)}" ${i === 0 ? "checked" : ""} />
          <div style="flex:1"><span class="price">${money(p.amount, p.currency)}</span>
            <div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description)}</div></div>
        </label>`).join("");

      if (saved) pollStatus(saved);
    }

    $("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      showError("");
      const form = new FormData(e.target);
      const payload = Object.fromEntries(form.entries());
      if (!payload.company_name || !payload.contact_name || !payload.email) {
        return showError("Please fill in company, name and email.");
      }
      if (payload.email.trim().toLowerCase() !== payload.email_confirm.trim().toLowerCase()) {
        return showError("The two email addresses don't match. Your login details are sent there, so please check it.");
      }
      delete payload.email_confirm;
      $("pay-btn").disabled = true;
      try {
        const order = await api("/api/orders", { method: "POST", body: JSON.stringify(payload) });
        const rzp = new Razorpay({
          key: order.key_id,
          order_id: order.order_id,
          amount: order.amount,
          currency: order.currency,
          name: config.product_name,
          description: `${payload.company_name} workspace`,
          prefill: { name: payload.contact_name, email: payload.email, contact: payload.phone },
          theme: { color: "#1677ff" },
          handler: async (resp) => {
            try { localStorage.setItem("signup_id", order.signup_id); } catch (_) {}
            showStatus("pending", payload.email);
            try {
              await api("/api/verify", { method: "POST", body: JSON.stringify(resp) });
            } catch (_) { /* webhook will still confirm it; keep polling */ }
            pollStatus(order.signup_id);
          },
          modal: { ondismiss: () => { $("pay-btn").disabled = false; } },
        });
        rzp.on("payment.failed", (r) => {
          showError(r.error?.description || "Payment failed, please try again.");
          $("pay-btn").disabled = false;
        });
        rzp.open();
      } catch (err) {
        showError(err.message);
        $("pay-btn").disabled = false;
      }
    });

    init().catch((err) => showError(err.message));
  </script>
</body>
</html>
